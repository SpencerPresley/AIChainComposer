[project]
name = "chaincomposer"
version = "0.2.0"
description = "A tool to quickly and easily build complex LLM chains. Chain Composer is a sophisticated wrapper around core LangChain functionality allowing for quickly building complex multi-layer LLM chains."
readme = "README.md"
authors = [
    { name = "Spencer Presley", email = "spencerpresley96@gmail.com" }
]
requires-python = ">=3.9,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=0.3.27",
    "langchain-anthropic>=0.3.19",
    "langchain-community>=0.3.29",
    "langchain-core>=0.3.75",
    "langchain-google-genai>=2.1.10",
    "langchain-mistralai>=0.2.11",
    "langchain-ollama>=0.3.7",
    "langchain-openai>=0.3.32",
    "pydantic>=2.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaincomposer"]

# TODO: Add back optional-dependencies when ready to test and pin versions
# [project.optional-dependencies]
# test = ["pytest", "pytest-cov", ...]  
# dev = ["black", "mypy", ...]
# docs = ["sphinx", ...]

[project.urls]
"Homepage" = "https://github.com/SpencerPresley/AIChainComposer"
"Bug Tracker" = "https://github.com/SpencerPresley/AIChainComposer/issues"
"PyPI" = "https://pypi.org/project/chaincomposer/"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=chaincomposer"
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
]

[tool.coverage.run]
source = ["chaincomposer"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
